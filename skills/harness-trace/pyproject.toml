[project]
name = "harness-trace"
version = "0.1.0"
description = "Structured execution trace capture and token baselining for claude-forge"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
    "tiktoken>=0.9.0",
]

[project.scripts]
harness-trace = "harness_trace.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_trace"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
